<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../">
<title>적 편대 · 도장과 공격 모션</title><link rel="stylesheet" href="css/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#090f1a;color:#e7edf6;font:16px/1.6 NeoDunggeunmo,monospace}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{color:#a9bbce;margin:8px 0 18px}.layout{display:grid;grid-template-columns:1fr 440px;gap:24px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}button,select{font:inherit;color:inherit;background:#162435;border:1px solid #46607b;border-radius:7px;padding:10px;cursor:pointer}button[aria-pressed=true]{border-color:#f4c171;background:#283447}button:focus-visible,select:focus-visible{outline:3px solid #f4c171}button b{display:block;font-size:19px}button small{display:block;color:#b6c6d6}.poses{width:100%;display:block}#battle{display:block;width:100%;border:1px solid #46607b;border-radius:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}a{color:#f4c171}#status{min-height:52px}#load{color:#f4c171}@media(max-width:820px){.layout{grid-template-columns:1fr}.combat{max-width:480px;margin:auto}.cards{gap:8px}main{padding:16px}}
</style></head><body><main><h1>ENEMY SQUADRON · 특수 편대</h1><p>기체를 선택해 좌·정면·우 자세와 실제 이동·사격 패턴을 확인하세요.</p><div id="load" role="status">원화 준비 중…</div><div class="layout"><section><div class="cards" id="cards"></div><p id="status"></p><p>검은 기체도 밝은 금속 가장자리와 표식으로 구분합니다. 도장은 원화의 명암·프로펠러·기울기 자세를 유지합니다.</p><a href="index.html">게임으로 돌아가기</a></section><section class="combat"><canvas id="battle" width="480" height="620" aria-label="선택한 적의 공격 미리보기"></canvas><div class="controls"><button id="replay">편대 다시 보기</button><button id="pause">일시정지</button><label>배경 <select id="bg"><option value="1">군도 해역</option><option value="4">야간 공업지대</option></select></label></div><p>아래 아군 기체는 조준 방향 확인용입니다. 연출은 반복 재생됩니다.</p></section></div></main>
<script src="js/assets.js"></script><script src="js/stages.js"></script><script src="js/enemy-patterns.js"></script><script>
'use strict';
const types=['crimson','scarlet','carbon','obsidian'];
const descriptions={crimson:'교차 급강하 · 날개 2연장 사격',scarlet:'좌우 회피 비행 · 날개 2연장 사격',carbon:'상공 선회 · 예고 후 고정 조준 3연사',obsidian:'중장갑 선회 · 중앙 통로가 열린 6발 탄막'};
const canvas=document.getElementById('battle'),g=canvas.getContext('2d');
let selected='crimson',ships=[],shots=[],age=0,paused=false,last=0,ready=false;
function reset(){age=0;shots=[];ships=[130,350].map((x,i)=>Object.assign({},Stages.ENEMY[selected],{x:x,y:-60-i*80,x0:x,age:0,bank:0,hoverT:0,targetY:145,dir:i?-1:1,fireCt:1.1+i*.35,lockAng:null}));}
function plane(ctx,e,x,y,w,pose,t){const art=Assets.body(e.art,pose,w,e.tint);if(!art)return;ctx.save();ctx.translate(x,y);ctx.drawImage(art.c,-art.px,-art.py);if(art.hubs.length){const f=Assets.propSet(art.r,e.prop)[Math.floor(t*30)%6];for(const h of art.hubs)ctx.drawImage(f,h.x-f.width/2,h.y-f.height/2);}ctx.restore();}
for(const key of types){const def=Stages.ENEMY[key],b=document.createElement('button');b.type='button';b.dataset.type=key;b.setAttribute('aria-pressed',key===selected?'true':'false');b.innerHTML='<b>'+def.name+'</b><canvas class="poses" width="280" height="128" aria-label="좌 정면 우 자세"></canvas><small>'+descriptions[key]+'</small>';b.onclick=()=>{selected=key;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));reset();document.getElementById('status').textContent=def.name+' · '+descriptions[key];};document.getElementById('cards').append(b);}
document.getElementById('replay').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'계속 재생':'일시정지';};
Promise.all([Assets.loadCore(),Assets.loadBg(1),Assets.loadBg(4)]).then(()=>{ready=true;reset();document.getElementById('load').textContent='4종 도장 · 3가지 비행 · 3가지 사격';document.getElementById('status').textContent=descriptions[selected];}).catch(e=>document.getElementById('load').textContent=e.message);
function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(ready){
 if(!paused){age+=dt;for(const e of ships){e.age+=dt;EnemyPatterns.move(e,dt,480);if(e.y>0&&e.y<500){e.fireCt-=dt;const a=Math.atan2(550-e.y,240-e.x);if(e.fire==='lockBurst'&&e.fireCt<=.5&&e.lockAng===null)e.lockAng=a;if(e.fireCt<=0)EnemyPatterns.fire(e,a,135,(x,y,vx,vy)=>shots.push({x,y,vx,vy}));}}for(const b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;}shots=shots.filter(b=>b.y<650&&b.y>-30&&b.x>-30&&b.x<510);if(age>12||ships.every(e=>e.y>720)&&shots.length===0)reset();}
 g.drawImage(Assets.image('bg'+document.getElementById('bg').value),0,0,480,620);
 for(const e of ships){if(e.lockAng!==null&&!e.volleyLeft){g.save();g.strokeStyle='#ffbaa0';g.setLineDash([8,7]);g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.lockAng)*320,e.y+Math.sin(e.lockAng)*320);g.stroke();g.restore();}plane(g,e,e.x,e.y,e.w,e.bank<-.35?'left':e.bank>.35?'right':'neutral',age);}
 for(const b of shots){g.fillStyle='#ffddb0';g.beginPath();g.arc(b.x,b.y,4,0,Math.PI*2);g.fill();g.strokeStyle='#c35a39';g.stroke();}
 plane(g,{art:'player',prop:'#cce4f7'},240,550,62,'neutral',age);
 document.querySelectorAll('[data-type]').forEach(b=>{const c=b.querySelector('canvas'),ctx=c.getContext('2d'),e=Stages.ENEMY[b.dataset.type];ctx.clearRect(0,0,c.width,c.height);['left','neutral','right'].forEach((p,i)=>plane(ctx,e,47+i*93,61,b.dataset.type==='obsidian'?78:70,p,age));});
 }requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
