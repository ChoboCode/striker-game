<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>보스 파괴 · 차지샷</title><link rel="stylesheet" href="css/fonts.css"><style>
body{margin:0;background:#0a111d;color:#e3eaf5;font:16px/1.6 NeoDunggeunmo,monospace}main{max-width:1040px;margin:auto;padding:24px}h1{font-size:26px}.layout{display:grid;grid-template-columns:480px 1fr;gap:24px}canvas{display:block;max-width:100%;background:#101e30;border:1px solid #40536c;border-radius:8px}button,select{font:inherit;padding:10px;background:#24354b;color:#fff;border:1px solid #607b9d;border-radius:5px;margin:4px;cursor:pointer}p{color:#aebed2}#modules{margin:12px 0}a{color:#ffd18a}@media(max-width:850px){.layout{grid-template-columns:1fr}}
</style></head><body><main><h1>보스 부위 파괴 · 입자 차지샷</h1><p id="status" role="status">이미지 준비 중…</p><div class="layout"><section><label>보스 <select id="boss"><option value="breakwater">1탄 브레이크워터</option><option value="dune">2탄 듄 콜로서스</option><option value="gemini">3탄 프로스트 제미니</option><option value="nightark">4탄 나이트 아크</option><option value="regent">5탄 아이언 리전트</option></select></label><button id="reset">원상태</button><canvas id="bossCanvas" width="480" height="460" aria-label="보스 파손 상태"></canvas><div id="modules"></div><p>부위 버튼을 누르면 내구도가 100% → 50% → 파괴로 바뀝니다. 비교를 위해 모든 부위를 공개합니다.</p></section><section><label>기체 <select id="ship"><option value="player">스트라이커</option><option value="lancer">랜서</option></select></label><canvas id="chargeCanvas" width="380" height="460" aria-label="입자 흡입과 차지샷 발사"></canvas><p>기체 주변 입자 흡입 → 기수 응축 → 전방 방출</p><a href="index.html">게임 열기</a> · <a href="tools/lancer-burst.html">랜서 필살기 보기</a></section></div></main>
<script src="js/assets.js"></script><script src="js/boss-art.js"></script><script src="js/bosses.js"></script><script src="js/charge-fx.js"></script><script>
const bc=document.getElementById('bossCanvas'),bg=bc.getContext('2d'),cc=document.getElementById('chargeCanvas'),cg=cc.getContext('2d');
let boss=null,last=0,time=0,blasts=[],bullet=null,previous=0;
const p={x:190,y:365,charge:0,chargeClock:0,chargeRelease:0};
function labels(){document.querySelectorAll('#modules button').forEach((b,i)=>b.textContent=boss.parts[i].name+' · '+(boss.parts[i].alive?Math.round(boss.parts[i].hp/boss.parts[i].maxHp*100)+'%':'파괴'));bg.clearRect(0,0,480,460);Bosses.draw(boss,bg,{W:480,H:460});}
function reset(){boss=Bosses.create(document.getElementById('boss').value,0);boss.x=240;boss.y=225;boss.state='fight';boss.phase=2;blasts=[];document.getElementById('modules').replaceChildren();boss.parts.forEach((p,i)=>{p.hidden=false;const btn=document.createElement('button');btn.onclick=()=>{if(!p.alive)return;p.hp=Math.max(0,p.hp-p.maxHp/2);p.flash=.12;if(!p.hp){p.alive=false;blasts.push({x:boss.x+p.ox*boss.w,y:boss.y+p.oy*boss.h,t:0});}labels();};document.getElementById('modules').append(btn);});labels();}
Promise.all([Assets.loadCore(),Assets.loadStageArt(4)]).then(()=>{reset();document.getElementById('status').textContent='부위별 파괴 원화와 차지 연출을 비교하세요.';});
document.getElementById('boss').onchange=reset;document.getElementById('reset').onclick=reset;
function frame(now){let dt=Math.min(.035,(now-last)/1000);last=now;time+=dt;if(boss){bg.clearRect(0,0,480,460);boss.t+=dt;boss.parts.forEach(p=>p.flash=Math.max(0,p.flash-dt));Bosses.draw(boss,bg,{W:480,H:460});blasts.forEach(b=>{b.t+=dt;if(b.t<.72)Assets.drawExplosion(bg,b.x,b.y,115,b.t/.72,'bomb-impact');});blasts=blasts.filter(b=>b.t<.72);
cg.clearRect(0,0,380,460);const cycle=time%3.3;p.charge=cycle<1.6?cycle/1.6:cycle<1.8?1:0;p.chargeClock=time;p.chargeRelease=cycle>=1.8&&cycle<2.08?2.08-cycle:0;if(cycle>=1.8&&previous<1.8)bullet={x:p.x,y:p.y-34,t:0,vx:0,vy:-840};if(cycle<previous)bullet=null;previous=cycle;
const kind=document.getElementById('ship').value,gold=kind==='lancer';const art=Assets.body(kind,'neutral',62);cg.drawImage(art.c,p.x-art.px,p.y-art.py);for(const hub of art.hubs){const f=Assets.propSet(art.r,'#d5d8ce')[Math.floor(time*30)%6];cg.drawImage(f,p.x+hub.x-f.width/2,p.y+hub.y-f.height/2);}ChargeFX.gather(cg,p,1,gold?'gold':'blue');if(bullet){bullet.palette=gold?'gold':'blue';bullet.t+=dt;bullet.y+=bullet.vy*dt;ChargeFX.shot(cg,bullet);}
}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
